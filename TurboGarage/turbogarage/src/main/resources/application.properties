spring.application.name=turbo-garage

# ===== DADOS SECRETOS =====
# Este arquivo vai para o GitHub, então aqui só tem VALORES DE EXEMPLO.
# A senha real do MySQL, o seu admin e o Gmail ficam em "segredos.properties"
# (mesma pasta). Esse arquivo está no .gitignore: NUNCA é enviado ao GitHub.
# O que estiver lá substitui os valores deste arquivo.
# Para criar: copie "segredos.exemplo.properties" com o nome "segredos.properties".
spring.config.import=optional:classpath:segredos.properties

# ===== BANCO DE DADOS (MySQL) =====
# Driver do MySQL 8 (mysql-connector-j)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# createDatabaseIfNotExist=true -> cria o banco login_db sozinho se ele não existir
spring.datasource.url=jdbc:mysql://localhost:3306/login_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&useUnicode=true&characterEncoding=UTF-8
# Usuário e senha DO MYSQL: coloque a senha real em segredos.properties
spring.datasource.username=root
spring.datasource.password=

# ===== CRIAÇÃO DAS TABELAS =====
# Executa src/main/resources/schema.sql toda vez que o servidor liga
# (usa CREATE TABLE IF NOT EXISTS, então não apaga nada)
spring.sql.init.mode=always

# ===== SESSÃO DE LOGIN =====
server.servlet.session.timeout=30m

# ===== ADMINISTRADOR =====
# Valores de exemplo. Para usar o SEU email/senha, coloque em segredos.properties.
# Ao ligar o servidor:
#  - se esse email ainda não existe, ele é criado com a senha abaixo (em BCrypt)
#  - se você já tinha se cadastrado com ele, ele vira ADMIN e mantém a sua senha
app.admin.email=admin@email.com
app.admin.senha=minhaSenha123

# ===== EMAIL (código de recuperação de senha) =====
# Sem configuração, o código aparece no CONSOLE do IntelliJ/VS Code (modo de teste).
# Para mandar email de verdade, configure o Gmail em segredos.properties
# (veja o modelo em segredos.exemplo.properties).
